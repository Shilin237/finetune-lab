<svg width="1200" height="350" viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">The LoRA concept</title><desc id="desc">A frozen base weight matrix combines with a small trainable low rank update. Only the adapter weights are trained during this experiment.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#142735"/><stop offset="1" stop-color="#223B4A"/></linearGradient></defs>
<rect width="1200" height="350" rx="18" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="39" y="40" font-size="12" letter-spacing="3" fill="#95DCC0">LORA / A TRAINABLE ADDITION</text>
<rect x="60" y="91" width="343" height="207" rx="14" fill="#2C4052" stroke="#5B7389"/><text x="80" y="126" font-size="15" fill="#AFBFCB">THE ORIGINAL</text><text x="80" y="163" font-size="29" font-weight="700" fill="#FFFFFF">Base weights</text><rect x="80" y="180" width="300" height="10" rx="4" fill="#52748A"/><rect x="80" y="201" width="300" height="10" rx="4" fill="#52748A"/><rect x="80" y="222" width="300" height="10" rx="4" fill="#52748A"/><text x="80" y="271" font-size="15" fill="#C1CBD5">LOCKED · NOT UPDATED</text>
<text x="451" y="210" font-size="68" fill="#94D7C1">+</text>
<rect x="529" y="91" width="365" height="207" rx="14" fill="#295348" stroke="#64AC8E"/><text x="550" y="126" font-size="15" fill="#A2DCCA">THE SMALL ADDITION</text><text x="550" y="163" font-size="29" font-weight="700" fill="#FFFFFF">LoRA adapter</text><rect x="550" y="185" width="22" height="70" rx="4" fill="#A3F4D1"/><rect x="579" y="185" width="22" height="70" rx="4" fill="#74D0A8"/><rect x="608" y="185" width="22" height="70" rx="4" fill="#A3F4D1"/><rect x="646" y="185" width="200" height="12" rx="4" fill="#A3F4D1"/><rect x="646" y="211" width="200" height="12" rx="4" fill="#74D0A8"/><rect x="646" y="237" width="200" height="12" rx="4" fill="#A3F4D1"/><text x="550" y="271" font-size="15" fill="#C0EDD8">TRAINABLE · LEARNS FROM DATA</text>
<path d="M914 192H963" stroke="#A8EBCB" stroke-width="3" stroke-dasharray="6 7"/><path d="M955 185L965 192L955 199" stroke="#A8EBCB" stroke-width="3"/><rect x="983" y="135" width="162" height="119" rx="13" fill="#D1F4E5"/><text x="1001" y="177" font-size="18" font-weight="700" fill="#245B49">Tuned model</text><text x="1001" y="202" font-size="14" fill="#4A8971">at inference</text><text x="1001" y="234" font-size="12" fill="#4A8971">Base + adapter</text>
</g></svg>
